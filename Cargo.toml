[package]
name = "vrcoscquery"
version = "0.2.0"
edition = "2021"
description = "OSCQuery for VRChat apps: advertise an OSC service so VRChat sends to it, and find and read VRChat's own OSCQuery service"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.34.0", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
log = "0.4.20"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
mdns-sd = "0.21.7"
reqwest = { version = "0.12", default-features = false }
thiserror = "1.0.51"

[dev-dependencies]
tokio = { version = "1.34.0", features = ["rt-multi-thread", "macros"] }
once_cell = "1.19.0"
anyhow = "1.0.75"
env_logger = "0.11"
