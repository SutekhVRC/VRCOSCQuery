[package]
name = "vrcoscquery"
version = "0.2.0"
edition = "2021"
description = "OSCQuery for VRChat apps: advertise an OSC service so VRChat sends to it, and find and read VRChat's own OSCQuery service"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.34.0", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
log = "0.4.20"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
# mdns-sd with ANY questions for a service type answered like PTR questions
# (PTR in Answers, SRV/TXT/A in Additionals). VRChat browses with ANY and
# never finds the service otherwise; see VRChatOSCQueryBugs.md. The fix lives
# on our fork (branch answer-any-for-service-type, based on upstream
# keepsimple1/mdns-sd), pinned to a commit so builds don't change when the
# branch moves. A direct git dependency (not [patch]) so apps using this
# library get the fix too. To update: rebase the branch onto upstream main,
# push, and move the rev here.
mdns-sd = { git = "https://github.com/SutekhVRC/mdns-sd", rev = "0f300e98ee5307751f8adf08f0199ed691d4d3a5" }
reqwest = { version = "0.12", default-features = false }
thiserror = "1.0.51"

[dev-dependencies]
tokio = { version = "1.34.0", features = ["rt-multi-thread", "macros"] }
once_cell = "1.19.0"
anyhow = "1.0.75"
env_logger = "0.11"
